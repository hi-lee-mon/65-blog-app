pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,mdx,css,yml,yaml}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx oxlint {staged_files}

    - name: markuplint
      glob:
        - "app/**/*.tsx"
        - "content/**/*.mdx"
      run: bunx markuplint {staged_files}

    # 型の誤りはステージしていないファイルにも波及するので、ファイルを絞らずプロジェクト全体を見る
    - name: typecheck
      glob: "*.{ts,tsx,mts,cts}"
      run: bun run typecheck
