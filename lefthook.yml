pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,mdx,css,yml,yaml}"
      run: bun run oxfmt {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bun run oxlint {staged_files}

    # glob は既定の gobwas で読まれ、* が / をまたぐ。** と書くと app/page.tsx のような直下のファイルに一致しない。
    # markuplint は [slug] を含むパスを直接渡すと黙って飛ばすので、{staged_files} を渡さず全体を見る
    - name: markuplint
      glob:
        - "app/*.tsx"
        - "content/*.mdx"
      run: bun run l:mu

    # 型の誤りはステージしていないファイルにも波及するので、ファイルを絞らずプロジェクト全体を見る
    - name: typecheck
      glob: "*.{ts,tsx,mts,cts}"
      run: bun run tc

# ページの見た目に関わるファイルを push するときだけ、ビルドして axe で検査する。
# pre-commit に置かない理由: 検査は 12〜27 秒かかり、コミットのたびに待たせないため（ADR 20261115-2200）
pre-push:
  jobs:
    - name: a11y
      glob:
        - "app/*"
        - "lib/*"
        - "theme/*"
        - "content/*"
        - "panda.config.ts"
      run: bun run a11y
