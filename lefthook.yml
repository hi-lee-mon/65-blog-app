pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,mdx,css,yml,yaml}"
      run: bun run oxfmt {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bun run oxlint {staged_files}

    # glob は既定の gobwas で読まれ、* が / をまたぐ。** と書くと app/page.tsx のような直下のファイルに一致しない。
    # markuplint は [slug] を含むパスを直接渡すと黙って飛ばすので、{staged_files} を渡さず全体を見る
    - name: markuplint
      glob:
        - "app/*.tsx"
        - "content/*.mdx"
      run: bun run lint:markup

    # 型の誤りはステージしていないファイルにも波及するので、ファイルを絞らずプロジェクト全体を見る
    - name: typecheck
      glob: "*.{ts,tsx,mts,cts}"
      run: bun run typecheck
